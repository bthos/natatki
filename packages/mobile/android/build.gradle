// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        kotlinVersion = "1.9.24"

        // Same NDK as the React Native 0.74 template; CI preinstalls it (android-apk.yml).
        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            // Use root node_modules in monorepo (android -> packages/mobile -> packages -> root)
            url("$rootDir/../../../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../../../node_modules/jsc-android/dist")
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            // Use root node_modules in monorepo (android -> packages/mobile -> packages -> root)
            url("$rootDir/../../../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../../../node_modules/jsc-android/dist")
        }
    }
    
    // Exclude com.facebook.react:react-native dependency from all subprojects
    // This dependency is not needed in React Native 0.74+ and causes build failures
    // Libraries like nozbe_watermelondb still declare it but it's not published to Maven
    configurations.all {
        exclude group: "com.facebook.react", module: "react-native"
    }
    
    // Add react-android dependency to all native modules that need React Native classes
    // Also set compileSdkVersion for native modules
    afterEvaluate { project ->
        if (project.hasProperty("android") && project.name != "app") {
            def reactNativeVersion = "0.74.5"
            project.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
            }
            project.dependencies {
                implementation("com.facebook.react:react-android:${reactNativeVersion}")
            }
        }
    }
}
