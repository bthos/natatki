name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, backend, web, mobile)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build backend
        run: npm run build -w @natatki/backend
      - name: Build web
        run: npm run build -w @natatki/web
